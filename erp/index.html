<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'">
  <title>JRC ERP — Jazallah Road Contracting</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b2230">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">JRC</div>
        <div>
          <div class="brand-name">Jazallah Road</div>
          <div class="brand-sub">Contracting ERP</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="side-btn" data-act="palette" title="Command palette"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg><span>Quick find</span></button>
        <button class="side-btn" data-act="toggleRail" title="Collapse sidebar"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v16H3zM9 4v16"/></svg><span>Collapse sidebar</span></button>
        <button class="side-btn" data-act="resetDemo" title="Reset demo data"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg><span>Reset demo data</span></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-act="toggleNav" aria-label="Menu"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div class="titles"><div class="crumb" id="crumb"></div><h1 id="page-title">Dashboard</h1></div>
        <form id="search" class="search"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></svg><input name="q" placeholder="Search or ask…" aria-label="Search or ask"><span class="kbd">/</span></form>
        <div class="topbar-right">
          <button class="icon-btn" id="palette-btn" data-act="palette" title="Command palette (Ctrl/⌘ K)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h20v12H2zM6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
          <button class="icon-btn" id="theme-btn" data-act="cycleTheme" title="Theme"></button>
          <a href="#/notifications" class="icon-btn bell" title="Notifications"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span class="dot" id="bell-count"></span></a>
          <a href="#/approvals" class="pill" id="approval-pill">Approvals <span id="approval-count">0</span></a>
          <div class="user"><span class="avatar" id="avatar">AD</span><select id="user-switch" class="user-name inline" data-change="switchUser" aria-label="Signed-in user"></select></div>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="assets/data.js"></script>
  <script src="assets/data-ext.js"></script>
  <script src="assets/icons.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/ledger.js"></script>
  <script src="assets/pages/dashboard.js"></script>
  <script src="assets/pages/projects.js"></script>
  <script src="assets/pages/projects-ext.js"></script>
  <script src="assets/pages/supply.js"></script>
  <script src="assets/pages/sales.js"></script>
  <script src="assets/pages/finance.js"></script>
  <script src="assets/pages/hr.js"></script>
  <script src="assets/pages/equipment.js"></script>
  <script src="assets/pages/admin.js"></script>
  <script src="assets/pages/accounting.js"></script>
  <script src="assets/pages/subcontracts.js"></script>
  <script src="assets/pages/production.js"></script>
  <script src="assets/pages/quality.js"></script>
  <script src="assets/pages/contracts.js"></script>
  <script src="assets/pages/assistant.js"></script>
  <script src="assets/pages/ext.js"></script>
  <script src="assets/ux.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
